  <body>
    <script>
      /* Device layout bootstrap — runs before first paint so a phone opens
         directly in the mobile presentation with no desktop flash. */
      (function () {
        try {
          var stored = localStorage.getItem("iv-layout-preference");
          var forced =
            stored === "phone" || stored === "tablet" || stored === "desktop"
              ? stored
              : null;
          var width = window.innerWidth;
          var shortSide = Math.min(width, window.innerHeight);
          var coarse = window.matchMedia("(pointer: coarse)").matches;
          var layout = forced
            ? forced
            : shortSide < 600 && coarse || width < 768
              ? "phone"
              : coarse
                ? width <= 1400
                  ? "tablet"
                  : "desktop"
                : width <= 1180
                  ? "tablet"
                  : "desktop";
          document.documentElement.dataset.layout = layout;
          document.documentElement.dataset.pointer = coarse ? "coarse" : "fine";
        } catch (error) {
          /* Layout CSS still applies without the bootstrap. */
        }
      })();
    </script>
    <div id="root"></div>
